name: taskrelay
description: "TaskRelay: finish what you plan, one day at a time."
publish_to: 'none'

# versionName.versionCode (the build number after + is the Play Store versionCode and must increase with every upload)
version: 2.1.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
